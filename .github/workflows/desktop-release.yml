name: Mac app release

# LogPose for Mac: on a `desktop-v<version>` tag (e.g. desktop-v1.0.0), build the .dmg on an
# Apple-silicon runner and attach it to a GitHub Release. See RELEASING.md → "Mac app".
#
# Signing + notarization switch on only when ALL of these repository secrets exist:
#   MACOS_CERTIFICATE           base64 of the "Developer ID Application" .p12 (cert + private key)
#   MACOS_CERTIFICATE_PASSWORD  the .p12's export password
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Siddharth Jaswal (TEAMID)"
#   APPLE_ID                    the Apple ID that owns the team
#   APPLE_APP_PASSWORD          an app-specific password for that Apple ID (appleid.apple.com)
#   APPLE_TEAM_ID               the 10-character team id
# Without them the workflow still publishes the dmg, UNSIGNED and labeled so.
#
# Tag scheme: `desktop-v*` never matches release.yml's `v*` (GitHub matches globs from the start
# of the tag name), so the plugin release flow ignores these tags; JitPack builds only tags a
# consumer asks it for. Desktop releases are created with make_latest=false so the repository's
# "Latest release" (and JitPack's latest-version badge) stays on the library/plugin line.
on:
  push:
    tags: [ 'desktop-v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing desktop-v<version> tag to (re)build and attach to its release'
        required: true

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build dmg (arm64)
    runs-on: macos-14   # Apple silicon
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches the app version
        run: |
          case "$TAG" in desktop-v*) ;; *) echo "::error::'$TAG' is not a desktop-v<version> tag"; exit 1 ;; esac
          declared="$(./gradlew -q :desktop:printDesktopVersion --no-daemon | tail -n 1)"
          if [ "desktop-v$declared" != "$TAG" ]; then
            echo "::error::Tag $TAG but desktop/build.gradle.kts declares $declared"
            exit 1
          fi
          echo "VERSION=$declared" >> "$GITHUB_ENV"

      - name: Decide whether to sign
        id: mode
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_CERTIFICATE_PASSWORD" ] && [ -n "$MACOS_SIGNING_IDENTITY" ] \
             && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarizing."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not set: publishing an UNSIGNED dmg."
          fi

      - name: Import the Developer ID certificate into a temporary keychain
        if: steps.mode.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/logpose-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Put it on the search list (keeping the login keychain) so codesign can find the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build the dmg (signed)
        if: steps.mode.outputs.signed == 'true'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: ./gradlew :desktop:packageDmg --no-daemon

      - name: Build the dmg (unsigned)
        if: steps.mode.outputs.signed != 'true'
        run: ./gradlew :desktop:packageDmg --no-daemon

      - name: Notarize and staple
        if: steps.mode.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG="desktop/build/compose/binaries/main/dmg/LogPose-$VERSION.dmg"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Name and checksum the dmg
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          mkdir -p out
          if [ "$SIGNED" = "true" ]; then NAME="LogPose-$VERSION-arm64.dmg"; else NAME="LogPose-$VERSION-arm64-unsigned.dmg"; fi
          cp "desktop/build/compose/binaries/main/dmg/LogPose-$VERSION.dmg" "out/$NAME"
          ( cd out && shasum -a 256 "$NAME" > "$NAME.sha256" )
          echo "DMG_NAME=$NAME" >> "$GITHUB_ENV"
          echo "DMG_SHA256=$(cut -d' ' -f1 "out/$NAME.sha256")" >> "$GITHUB_ENV"

      - name: Fill in the Homebrew cask
        run: |
          # The template's url names the signed asset; an unsigned build points it at its own file.
          SUFFIX="${DMG_NAME#LogPose-$VERSION}"   # -arm64.dmg or -arm64-unsigned.dmg
          sed -e "s/version \".*\"/version \"$VERSION\"/" \
              -e "s/sha256 \".*\"/sha256 \"$DMG_SHA256\"/" \
              -e "s/-arm64\.dmg\"/$SUFFIX\"/" \
              packaging/homebrew/logpose.rb > out/logpose.rb

      - name: Write release notes
        env:
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          {
            echo "## LogPose for Mac $VERSION"
            echo
            echo "Apple silicon (arm64), macOS 11 or later."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with a Developer ID and notarized by Apple: open the dmg and drag LogPose to Applications."
            else
              echo "> **Unsigned build.** macOS will refuse to open it at first. After the first attempt, go to"
              echo "> *System Settings → Privacy & Security* and click **Open Anyway** (macOS 15+), or right-click"
              echo "> LogPose.app → *Open* on older macOS. Only do this for a dmg downloaded from this page."
            fi
            echo
            echo "SHA-256: \`$DMG_SHA256\`"
          } > out/notes.md

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: LogPose for Mac ${{ env.VERSION }}${{ steps.mode.outputs.signed != 'true' && ' (unsigned)' || '' }}
          body_path: out/notes.md
          make_latest: 'false'
          files: |
            out/${{ env.DMG_NAME }}
            out/${{ env.DMG_NAME }}.sha256
            out/logpose.rb

      - name: Remove the temporary keychain
        if: always() && steps.mode.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/logpose-signing.keychain-db" || true
